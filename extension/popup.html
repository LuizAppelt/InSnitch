<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>InSnitch</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    
    <!-- HEADER -->
    <header class="header">
      <div class="logo-group">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line></svg>
        </div>
        <span class="logo-title">InSnitch</span>
      </div>
      <div id="backend-status" class="status-badge checking">
        <span class="dot"></span>
        <span id="backend-status-text">Verificando...</span>
      </div>
    </header>

    <!-- ACTIVE PROFILE CARD -->
    <main class="main-content">
      <div class="profile-card">
        <div class="profile-meta">
          <span class="label">Perfil Detectado:</span>
          <h2 id="detected-username" class="username">Nenhum perfil aberto</h2>
        </div>
        <div id="tab-hint" class="hint">Abra um perfil no Instagram para sincronizar.</div>
      </div>

      <!-- SCAN OPTIONS -->
      <div class="options-container">
        <button id="btn-toggle-options" class="btn-toggle-options" type="button">
          <span>⚙️ Opções de Varredura</span>
          <span id="options-arrow">▸</span>
        </button>
        <div id="options-panel" class="options-panel hidden">
          <div class="option-group">
            <label class="option-label">Modo & Velocidade:</label>
            <select id="select-scan-mode" class="option-select">
              <option value="safe" selected>🛡️ Seguro (Recomendado p/ &gt;1.000)</option>
              <option value="fast">⚡ Rápido (Perfis pequenos)</option>
            </select>
          </div>
          <div class="option-group">
            <label class="option-label">Limite de Coleta:</label>
            <select id="select-scan-limit" class="option-select">
              <option value="3000" selected>Até 3.000 usuários</option>
              <option value="10000">Até 10.000 (Ilimitado)</option>
              <option value="1000">Até 1.000 usuários</option>
            </select>
          </div>
        </div>
      </div>

      <!-- ACTION BUTTON -->
      <button id="btn-sync" class="btn-primary" disabled>
        <span id="btn-icon">⚡</span>
        <span id="btn-text">Sincronizar com InSnitch</span>
      </button>

      <!-- PROGRESS & STATUS BOX -->
      <div id="progress-box" class="progress-box hidden">
        <div class="spinner"></div>
        <span id="progress-text">Iniciando coleta...</span>
      </div>

      <!-- RESULT CARD -->
      <div id="result-card" class="result-card hidden">
        <div class="result-header">
          <span class="success-icon">✓</span>
          <span class="result-title">Sincronização Concluída!</span>
        </div>
        <div class="metrics-summary">
          <div class="metric-item">
            <span class="metric-val text-green" id="res-new">+0</span>
            <span class="metric-lbl">Novos</span>
          </div>
          <div class="metric-item">
            <span class="metric-val text-red" id="res-lost">-0</span>
            <span class="metric-lbl">Unfollows</span>
          </div>
          <div class="metric-item">
            <span class="metric-val text-blue" id="res-following">+0</span>
            <span class="metric-lbl">Seguiu</span>
          </div>
          <div class="metric-item">
            <span class="metric-val text-amber" id="res-not-following">0</span>
            <span class="metric-lbl">Não Seguem</span>
          </div>
        </div>
        <button id="btn-open-dashboard" class="btn-secondary">
          Abrir no Dashboard Local ↗
        </button>
      </div>

      <!-- ERROR MESSAGE -->
      <div id="error-box" class="error-box hidden">
        <span id="error-text">Ocorreu um erro.</span>
      </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
      <span>Dashboard: <strong>http://localhost:8000</strong></span>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
